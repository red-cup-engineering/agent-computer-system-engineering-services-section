name: ci

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  group: relating-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Run examples
        run: pnpm run examples

      - name: Generate API documentation
        run: pnpm run docs:api
